[package]
name = "stellar-doc-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }
url = "2"
futures = "0.3"

# Stellar SDK
stellar_sdk = "0.1"
stellar-base = "0.5"
# Crypto — sodiumoxide is pinned to 0.2.6 because newer versions
# changed the libsodium bindings ABI which breaks stellar-sdk at runtime.
# See: https://github.com/nickel-org/rust-sodium/issues/234
sodiumoxide = "=0.2.6"
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Redis cache
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Rate limiting
governor = "0.6"

# Metrics
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Crypto
sha2 = "0.10"
hex = "0.4"
chrono = "0.4.43"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

# Shared mutable state for health cache
once_cell = "1.19"

[dev-dependencies]
httpmock = "0.7"
axum-test = "16.4.1"
