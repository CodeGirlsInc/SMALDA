name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    # Weekly security audit on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  # ─────────────────────────────────────────────
  # BACKEND — (NestJS)
  # ─────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript check)
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check locale parity
        run: npm run check:locales

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Accessibility tests (jest-axe)
        run: npm run test:a11y -- --passWithNoTests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # TODO: Remove --passWithNoTests and switch to test:coverage once real test suites exist
      # - name: Unit tests with coverage
      #   run: npm run test:coverage
      # 
      # - name: Upload coverage artifact
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: frontend-coverage
      #     path: frontend/coverage/

  # ─────────────────────────────────────────────
  # SMART CONTRACTS — Rust / Cargo
  # ─────────────────────────────────────────────
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all

      - name: Tests
        run: cargo test --all

      - name: Bench (compile only)
        run: cargo bench --no-run

      - name: Install cargo-audit
        run: cargo install cargo-audit
        if: github.event_name == 'schedule'

      - name: Security audit (cargo-audit)
        run: cargo audit
        if: github.event_name == 'schedule'

      - name: Install cargo-deny
        run: cargo install cargo-deny
        if: github.event_name == 'schedule'

      - name: Dependency policy check (cargo-deny)
        run: cargo deny check
        if: github.event_name == 'schedule'
        # ─────────────────────────────────────────────
  # BACKEND E2E — NestJS + Postgres + Redis
  # ─────────────────────────────────────────────
  backend-e2e:
    name: Backend E2E (NestJS)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main — e2e is too slow for every branch push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smalda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: smalda_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      STELLAR_NETWORK: Test SDF Network ; September 2015
      STELLAR_SECRET_KEY: SDUMMYTESTKEYFORCIE2E123456789012345678901234567890
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      JWT_SECRET: ci-test-secret-32-chars-minimum-ok
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-ok
      JWT_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      GITHUB_CLIENT_ID: ci-test-github-client-id
      GITHUB_CLIENT_SECRET: ci-test-github-client-secret
      GITHUB_CALLBACK_URL: http://localhost:3001/api/auth/github/callback
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_USER: test@smalda.com
      MAIL_PASSWORD: test
      MAIL_FROM: test@smalda.com
      UPLOAD_DIR: ./uploads-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e